<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>신청 완료</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0B132B;
      color: #F8F9FA;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 60px 20px;
    }

    .card {
      background-color: #1C2541;
      border-radius: 16px;
      padding: 28px;
      box-sizing: border-box;
      text-align: center;
    }

    h1 {
      margin-top: 0;
      color: #E2B05E;
      font-size: 30px;
    }

    p {
      line-height: 1.8;
      font-size: 16px;
    }

    .button-row {
      margin-top: 24px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .button {
      display: inline-block;
      padding: 14px 20px;
      background-color: #E2B05E;
      color: #0B132B;
      text-decoration: none;
      font-weight: bold;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-size: 15px;
    }

    .muted {
      font-size: 14px;
      opacity: 0.86;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>신청이 완료되었습니다</h1>
      <p>
        입력하신 이메일로 상세 진단 결과를 발송할 예정입니다.
      </p>
      <p>
        메일 도착까지 시간이 조금 걸릴 수 있으니,
        받은편지함과 스팸함을 함께 확인해주세요.
      </p>
      <p class="muted">
        브라우저 정책에 따라 창 닫기가 제한될 수 있습니다.
        이 경우 확인 버튼을 누르면 시작 화면으로 이동합니다.
      </p>

      <div class="button-row">
        <button class="button" onclick="closeOrGoHome()">확인</button>
      </div>
    </div>
  </div>

  <script>
    function closeOrGoHome() {
      window.close();

      setTimeout(function () {
        window.location.href = "/";
      }, 300);
    }
  </script>
</body>
</html>

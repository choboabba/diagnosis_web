<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>상세 결과 발송 완료</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0B132B;
      color: #F8F9FA;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 60px 20px;
    }

    .card {
      background-color: #1C2541;
      border-radius: 16px;
      padding: 28px;
      box-sizing: border-box;
      text-align: center;
    }

    h1 {
      margin-top: 0;
      color: #E2B05E;
      font-size: 30px;
    }

    p {
      line-height: 1.8;
      font-size: 16px;
    }

    .button-row {
      margin-top: 24px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .button {
      display: inline-block;
      padding: 14px 20px;
      background-color: #E2B05E;
      color: #0B132B;
      text-decoration: none;
      font-weight: bold;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-size: 15px;
    }

    .muted {
      font-size: 14px;
      opacity: 0.86;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>상세 결과 발송이 접수되었습니다</h1>
      <p>
        입력하신 이메일로 유료 상세 진단 결과를 발송합니다.
        고객 정보와 진단 결과는 연결된 시트에도 함께 저장됩니다.
      </p>
      <p class="muted">
        테스트 단계에서는 결제 없이 발송 흐름을 확인합니다.
        실제 결제 연동 후에는 결제 완료 건만 이 화면으로 이동하게 됩니다.
      </p>

      <div class="button-row">
        <a class="button" href="/">처음으로</a>
      </div>
    </div>
  </div>
</body>
</html>

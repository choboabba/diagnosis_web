<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>부모 유형 진단 결과</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0B132B;
      color: #F8F9FA;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .card {
      background-color: #1C2541;
      border-radius: 16px;
      padding: 24px;
      box-sizing: border-box;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 10px;
      color: #E2B05E;
      font-size: 30px;
      line-height: 1.35;
    }

    h2 {
      margin: 0 0 12px;
      color: #E2B05E;
      font-size: 20px;
      line-height: 1.45;
    }

    h3 {
      margin: 0 0 8px;
      font-size: 17px;
      color: #F8F9FA;
    }

    p {
      line-height: 1.75;
      font-size: 16px;
      margin: 10px 0;
    }

    ul {
      margin: 12px 0 0;
      padding-left: 20px;
      line-height: 1.75;
    }

    .eyebrow {
      color: #E2B05E;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 0.03em;
      margin-bottom: 8px;
    }

    .summary {
      background-color: rgba(226, 176, 94, 0.12);
      border: 1px solid rgba(226, 176, 94, 0.25);
      border-radius: 12px;
      padding: 14px 16px;
      margin-top: 14px;
    }

    .muted {
      font-size: 14px;
      opacity: 0.84;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 22px;
    }

    .button {
      display: inline-block;
      padding: 14px 20px;
      background-color: #E2B05E;
      color: #0B132B;
      text-decoration: none;
      font-weight: bold;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-size: 15px;
    }

    .button.secondary {
      background-color: #3A506B;
      color: #F8F9FA;
    }

    .button.ghost {
      background-color: transparent;
      color: #E2B05E;
      border: 1px solid rgba(226, 176, 94, 0.45);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 14px;
    }

    .metric,
    .action-box {
      background-color: #0B132B;
      border: 1px solid rgba(248, 249, 250, 0.12);
      border-radius: 12px;
      padding: 14px 16px;
    }

    .metric-name,
    .action-box strong {
      display: block;
      color: #E2B05E;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .metric-value {
      font-size: 22px;
      font-weight: bold;
    }

    .chip-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .chip {
      display: inline-block;
      padding: 8px 12px;
      border-radius: 999px;
      background-color: rgba(226, 176, 94, 0.12);
      border: 1px solid rgba(226, 176, 94, 0.25);
      color: #F8F9FA;
      font-size: 13px;
    }

    .section-divider {
      text-align: center;
      padding: 24px 0 6px;
    }

    .section-divider span {
      display: inline-block;
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 999px;
      background-color: rgba(248, 249, 250, 0.08);
      border: 1px solid rgba(248, 249, 250, 0.14);
      color: rgba(248, 249, 250, 0.7);
      letter-spacing: 0.03em;
    }

    .paid-card {
      border: 1px solid rgba(226, 176, 94, 0.35);
      background: linear-gradient(180deg, rgba(226, 176, 94, 0.12), rgba(28, 37, 65, 1));
    }

    .lead-form {
      display: grid;
      gap: 14px;
      margin-top: 18px;
    }

    .field-label {
      display: block;
      font-size: 14px;
      margin-bottom: 6px;
    }

    .field-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid rgba(248, 249, 250, 0.16);
      background-color: #0B132B;
      color: #F8F9FA;
      font-size: 15px;
      box-sizing: border-box;
    }

    .consent-row {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin-top: 14px;
      font-size: 14px;
      line-height: 1.55;
    }

    .consent-row input {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      accent-color: #E2B05E;
    }

    @media (max-width: 720px) {
      .container {
        padding: 22px 14px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="resultContainer"></div>

    <div class="button-row">
      <a href="/questions?page=1" class="button secondary">다시 진단하기</a>
      <button type="button" class="button ghost" id="resetBtn">응답 초기화</button>
    </div>
  </div>

  <script>
    function escapeHtml(value) {
      if (value == null) return "";
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function getStoredResult() {
      const raw = localStorage.getItem("diagnosisResult");
      return raw ? JSON.parse(raw) : null;
    }

    function getStoredAnswers() {
      const raw = localStorage.getItem("answers");
      return raw ? JSON.parse(raw) : null;
    }

    function getStoredLeadInfo() {
      const raw = localStorage.getItem("leadInfo");
      return raw ? JSON.parse(raw) : {};
    }

    function renderTags(tags) {
      if (!Array.isArray(tags) || tags.filter(Boolean).length === 0) return "";
      return `
        <div class="chip-wrap">
          ${tags.filter(Boolean).map(tag => `<span class="chip">${escapeHtml(tag)}</span>`).join("")}
        </div>
      `;
    }

    function renderScores(result) {
      const scores = result && result.scores ? result.scores : {};
      const items = [
        { name: "Energy", value: scores.energy },
        { name: "Compass", value: scores.compass },
        { name: "Action", value: scores.action }
      ].filter(item => item.value !== undefined && item.value !== null);

      if (items.length === 0) return "";

      return `
        <div class="grid">
          ${items.map(item => `
            <div class="metric">
              <span class="metric-name">${item.name}</span>
              <span class="metric-value">${escapeHtml(item.value)}</span>
            </div>
          `).join("")}
        </div>
      `;
    }

    async function submitPaidResultRequest() {
      const consentPrivacy = document.getElementById("consentPrivacy");
      if (!consentPrivacy || !consentPrivacy.checked) {
        alert("개인정보 수집 및 이용에 동의해 주세요.");
        return;
      }

      const name = document.getElementById("leadName").value.trim();
      const email = document.getElementById("leadEmail").value.trim();
      const childCount = document.getElementById("leadChildCount").value.trim();
      const childAge = document.getElementById("leadChildAge").value.trim();
      const job = document.getElementById("leadJob").value.trim();

      if (!name) {
        alert("이름을 입력해 주세요.");
        return;
      }

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        alert("이메일을 정확히 입력해 주세요.");
        return;
      }

      const diagnosisResult = getStoredResult();
      if (!diagnosisResult) {
        alert("진단 결과가 없습니다. 먼저 진단을 진행해 주세요.");
        return;
      }

      const submitButton = document.getElementById("paidSubmitBtn");
      if (submitButton) {
        submitButton.disabled = true;
        submitButton.textContent = "유료 결과 발송 중...";
      }

      const payload = {
        name,
        email,
        child_count: childCount,
        child_age: childAge,
        job,
        answers: getStoredAnswers(),
        diagnosis_result: diagnosisResult,
        diagnosis_version: "v2_30q",
        submitted_at: new Date().toISOString(),
        source: "paid_result_request",
        product_code: "paid_parent_diagnosis_result",
        product_name: "유료 부모 유형 상세 진단 결과",
        payment_status: "paid_test_bypass",
        payment_provider: "test",
        payment_order_id: "TEST-" + Date.now(),
        consent_privacy: true,
        consent_marketing: document.getElementById("consentMarketing")?.checked ?? false
      };

      try {
        const response = await fetch("/api/submit-lead", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        if (!data.success) {
          alert("유료 결과 발송 중 오류가 발생했습니다: " + (data.error || "알 수 없는 오류"));
          return;
        }

        localStorage.setItem("leadInfo", JSON.stringify({
          name,
          email,
          child_count: childCount,
          child_age: childAge,
          job
        }));

        window.location.href = "/complete";
      } catch (error) {
        alert("서버 오류: " + error.message);
      } finally {
        if (submitButton) {
          submitButton.disabled = false;
          submitButton.textContent = "결제 건너뛰고 유료 결과 이메일 발송 테스트";
        }
      }
    }

    function renderLeadForm(savedLead) {
      return `
        <div class="lead-form">
          <div>
            <label class="field-label" for="leadName">이름 *</label>
            <input class="field-input" type="text" id="leadName" placeholder="이름을 입력해 주세요" value="${escapeHtml(savedLead.name || "")}" />
          </div>
          <div>
            <label class="field-label" for="leadEmail">이메일 *</label>
            <input class="field-input" type="email" id="leadEmail" placeholder="example@email.com" value="${escapeHtml(savedLead.email || "")}" />
          </div>
          <div>
            <label class="field-label" for="leadChildCount">자녀수 <span class="muted">(선택)</span></label>
            <input class="field-input" type="text" id="leadChildCount" placeholder="예: 1" value="${escapeHtml(savedLead.child_count || "")}" />
          </div>
          <div>
            <label class="field-label" for="leadChildAge">자녀 연령 <span class="muted">(선택)</span></label>
            <input class="field-input" type="text" id="leadChildAge" placeholder="예: 7세, 3세" value="${escapeHtml(savedLead.child_age || "")}" />
          </div>
          <div>
            <label class="field-label" for="leadJob">직업 <span class="muted">(선택)</span></label>
            <input class="field-input" type="text" id="leadJob" placeholder="예: 회사원" value="${escapeHtml(savedLead.job || "")}" />
          </div>
        </div>
        <label class="consent-row">
          <input type="checkbox" id="consentPrivacy" />
          <span>개인정보 수집 및 이용에 동의합니다. 필수</span>
        </label>
        <label class="consent-row">
          <input type="checkbox" id="consentMarketing" />
          <span>진단 관련 콘텐츠와 안내 메일 수신에 동의합니다. 선택</span>
        </label>
        <div class="button-row">
          <button type="button" class="button" id="paidSubmitBtn" onclick="submitPaidResultRequest()">결제 건너뛰고 유료 결과 이메일 발송 테스트</button>
        </div>
      `;
    }

    function renderResult() {
      const resultContainer = document.getElementById("resultContainer");
      const result = getStoredResult();

      if (!result) {
        resultContainer.innerHTML = `
          <div class="card">
            <div class="eyebrow">진단 결과</div>
            <h1>아직 진단 결과가 없습니다</h1>
            <p>먼저 진단 문항에 응답하면 무료 결과와 유료 결과 신청 흐름을 확인할 수 있습니다.</p>
            <div class="button-row">
              <a href="/questions?page=1" class="button">진단 시작하기</a>
            </div>
          </div>
        `;
        return;
      }

      const savedLead = getStoredLeadInfo();
      const typeName = escapeHtml(result.parent_type || "결과 확인 필요");
      const relief = escapeHtml(result.relief || "현재 반복 패턴을 기준으로 결과를 정리했습니다.");
      const today = escapeHtml(result.today || "오늘 바로 할 수 있는 행동을 1개만 선택합니다.");
      const displayTags = Array.isArray(result.display_tags) ? result.display_tags : [];

      resultContainer.innerHTML = `
        <div class="card">
          <div class="eyebrow">무료 진단 결과</div>
          <h1>${typeName}</h1>
          <p class="summary">${relief}</p>
          ${renderTags(displayTags)}
        </div>

        <div class="card">
          <h2>무료 결과에서 확인하는 것</h2>
          <ul>
            <li>현재 유형 이름</li>
            <li>최근 2주 동안 가장 자주 흔들린 영역</li>
            <li>오늘 바로 시도할 수 있는 작은 행동 1개</li>
          </ul>
          ${renderScores(result)}
          <div class="action-box">
            <strong>오늘 바로 할 수 있는 것 1개</strong>
            <p>${today}</p>
          </div>
        </div>

        <div class="section-divider">
          <span>여기까지가 무료 진단 결과입니다</span>
        </div>

        <div class="card paid-card">
          <div class="eyebrow">유료 상세 결과 이메일 발송</div>
          <h2>결제 후 입력한 이메일로 상세 진단 결과를 보내드립니다</h2>
          <p>
            실제 서비스에서는 결제 완료 후 아래 고객 정보와 진단 결과가 이미 연결된 시트로 저장되고,
            유료 상세 결과가 입력한 이메일로 발송됩니다.
          </p>
          <p class="muted">
            지금은 테스트 단계이므로 결제 단계는 건너뛰고, 동일한 데이터 저장/이메일 발송 흐름만 확인합니다.
          </p>
          <ul>
            <li>고객 정보와 진단 결과를 연결된 시트로 전송</li>
            <li>유료 상세 결과 이메일 본문 생성</li>
            <li>입력한 이메일 주소로 결과 발송</li>
            <li>테스트 결제 상태값: paid_test_bypass</li>
          </ul>
          ${renderLeadForm(savedLead)}
        </div>
      `;
    }

    document.getElementById("resetBtn").addEventListener("click", function () {
      localStorage.removeItem("answers");
      localStorage.removeItem("diagnosisResult");
      localStorage.removeItem("leadInfo");
      window.location.href = "/questions?page=1";
    });

    renderResult();
  </script>
</body>
</html>

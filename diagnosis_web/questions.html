<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>부모 유형 무료 진단</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0B132B;
      color: #F8F9FA;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .card {
      background-color: #1C2541;
      border-radius: 16px;
      padding: 24px;
      box-sizing: border-box;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 12px;
      color: #E2B05E;
      font-size: 30px;
    }

    p {
      line-height: 1.7;
      font-size: 16px;
      margin: 10px 0;
    }

    .lead {
      font-size: 20px;
      font-weight: bold;
      color: #F8F9FA;
      margin-top: 8px;
    }

    .sub {
      color: #F8F9FA;
      opacity: 0.95;
    }

    .notice {
      margin-top: 16px;
      font-size: 14px;
      opacity: 0.95;
    }

    .notice.strong {
      background-color: rgba(226, 176, 94, 0.12);
      border: 1px solid rgba(226, 176, 94, 0.25);
      padding: 14px 16px;
      border-radius: 12px;
      color: #F8F9FA;
    }

    .progress-wrap {
      margin-top: 20px;
      margin-bottom: 12px;
    }

    .progress {
      font-size: 14px;
      color: #E2B05E;
      font-weight: bold;
    }

    .mini-copy {
      font-size: 13px;
      opacity: 0.82;
      margin-top: 6px;
    }

    .question {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid rgba(248, 249, 250, 0.15);
    }

    .question-title {
      margin-bottom: 12px;
      font-size: 17px;
      font-weight: bold;
      line-height: 1.6;
    }

    .options label {
      display: block;
      margin-bottom: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    .button-row {
      margin-top: 28px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .button {
      display: inline-block;
      padding: 14px 20px;
      background-color: #E2B05E;
      color: #0B132B;
      font-weight: bold;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-size: 15px;
    }

    .button.secondary {
      background-color: #3A506B;
      color: #F8F9FA;
    }

    @media (max-width: 640px) {
      .container {
        padding: 20px 14px;
      }

      h1 {
        font-size: 26px;
      }

      .lead {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>부모 유형 무료 진단</h1>

      <p class="lead">
        좋은 부모가 되려는 마음만으로는 반복되는 현실이 바뀌지 않습니다.
      </p>

      <p class="sub">
        부모마다 먼저 무너지는 구조는 다릅니다. 그래서 진단이 필요합니다.
      </p>

      <p class="notice strong">
        이 진단은 부모를 평가하는 도구가 아니라,
        현재 가장 먼저 무너지고 있는 구조를 이해하기 위한 해석입니다.
      </p>

      <p class="notice">
        최근의 반복 패턴에 가깝게 응답해주세요.<br />
        1점 = 전혀 아니다 / 2점 = 거의 아니다 / 3점 = 보통이다 / 4점 = 자주 그렇다 / 5점 = 거의 항상 그렇다
      </p>

      <div class="progress-wrap">
        <div class="progress" id="progressText"></div>
        <div class="mini-copy">지금 어떤 구조가 먼저 흔들리는지 확인하는 과정입니다.</div>
      </div>

      <form id="questionForm">
        <div id="questionsContainer"></div>

        <div class="button-row">
          <button type="button" id="prevBtn" class="button secondary">이전</button>
          <button type="button" id="nextBtn" class="button">다음으로</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const QUESTIONS = [
      "하루가 끝나기 전부터 이미 감정적으로 바닥난 느낌이 든다",
      "아이의 작은 행동에도 예민하게 반응할 때가 많다",
      "혼자 회복할 시간이 거의 없다고 느낀다",
      "충분히 쉬지 못한 날에는 부모 역할이 더 버겁게 느껴진다",
      "문제가 생기면 해결보다 버티는 데 에너지를 많이 쓴다",
      "육아 후 '내가 너무 지쳐 있다'는 느낌이 자주 든다",

      "아이를 어떻게 대해야 할지 기준이 자주 흔들린다",
      "육아 정보를 많이 볼수록 오히려 더 혼란스러워진다",
      "내 방식이 맞는지 자주 의심하게 된다",
      "다른 부모와 비교하며 불안해질 때가 있다",
      "상황이 바뀌면 내 판단도 쉽게 흔들린다",
      "우리 집에서 무엇이 중요한지 비교적 분명한 편이다",

      "좋다고 느낀 방법도 며칠 지나면 유지되지 않는다",
      "알고 있는 것과 실제로 하는 것 사이의 차이가 크다",
      "루틴을 만들려고 해도 자꾸 끊어진다",
      "문제가 생길 때마다 같은 패턴을 반복하는 느낌이 든다",
      "피곤한 날에도 최소한의 루틴은 비교적 유지되는 편이다",
      "한 번 정한 방식은 큰 흔들림 없이 이어가는 편이다"
    ];

    const TOTAL_QUESTIONS = 18;
    const QUESTIONS_PER_PAGE = 3;
    const TOTAL_PAGES = TOTAL_QUESTIONS / QUESTIONS_PER_PAGE;

    function getPageNumber() {
      const params = new URLSearchParams(window.location.search);
      const page = parseInt(params.get("page"), 10) || 1;
      return Math.min(Math.max(page, 1), TOTAL_PAGES);
    }

    function getStoredAnswers() {
      return JSON.parse(localStorage.getItem("answers") || "[]");
    }

    function setStoredAnswers(answers) {
      localStorage.setItem("answers", JSON.stringify(answers));
    }

    function renderQuestions(page) {
      const container = document.getElementById("questionsContainer");
      const progressText = document.getElementById("progressText");
      const nextBtn = document.getElementById("nextBtn");
      const prevBtn = document.getElementById("prevBtn");

      const startIndex = (page - 1) * QUESTIONS_PER_PAGE;
      const endIndex = startIndex + QUESTIONS_PER_PAGE;
      const pageQuestions = QUESTIONS.slice(startIndex, endIndex);

      progressText.textContent = `${page} / ${TOTAL_PAGES} 페이지`;

      prevBtn.style.display = page === 1 ? "none" : "inline-block";
      nextBtn.textContent = page === TOTAL_PAGES ? "결과 보기" : "다음으로";

      container.innerHTML = pageQuestions.map((question, idx) => {
        const questionNumber = startIndex + idx + 1;
        return `
          <div class="question">
            <div class="question-title">Q${questionNumber}. ${question}</div>
            <div class="options">
              <label><input type="radio" name="q${questionNumber}" value="1"> 1점</label>
              <label><input type="radio" name="q${questionNumber}" value="2"> 2점</label>
              <label><input type="radio" name="q${questionNumber}" value="3"> 3점</label>
              <label><input type="radio" name="q${questionNumber}" value="4"> 4점</label>
              <label><input type="radio" name="q${questionNumber}" value="5"> 5점</label>
            </div>
          </div>
        `;
      }).join("");

      restoreCurrentPageAnswers(page);
    }

    function restoreCurrentPageAnswers(page) {
      const answers = getStoredAnswers();
      const startIndex = (page - 1) * QUESTIONS_PER_PAGE;

      for (let i = 0; i < QUESTIONS_PER_PAGE; i++) {
        const questionNumber = startIndex + i + 1;
        const savedValue = answers[startIndex + i];

        if (savedValue !== undefined) {
          const radio = document.querySelector(`input[name="q${questionNumber}"][value="${savedValue}"]`);
          if (radio) {
            radio.checked = true;
          }
        }
      }
    }

    function saveCurrentPageAnswers(page) {
      const answers = getStoredAnswers();
      const startIndex = (page - 1) * QUESTIONS_PER_PAGE;

      for (let i = 0; i < QUESTIONS_PER_PAGE; i++) {
        const questionNumber = startIndex + i + 1;
        const checked = document.querySelector(`input[name="q${questionNumber}"]:checked`);

        if (!checked) {
          alert(`${questionNumber}번 문항에 응답해주세요.`);
          return false;
        }

        answers[startIndex + i] = parseInt(checked.value, 10);
      }

      setStoredAnswers(answers);
      return true;
    }

    async function submitDiagnosis() {
      const answers = getStoredAnswers();

      if (answers.length !== TOTAL_QUESTIONS || answers.some(v => typeof v !== "number")) {
        alert("응답 데이터가 완전하지 않습니다.");
        return;
      }

      try {
        const response = await fetch("/api/diagnose", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ answers })
        });

        const data = await response.json();

        if (!data.success) {
          alert("진단 실패: " + data.error);
          return;
        }

        const result = data.result;
        localStorage.setItem("diagnosisResult", JSON.stringify(result));
        window.location.href = "/result";
      } catch (error) {
        alert("서버 오류: " + error.message);
      }
    }

    document.addEventListener("DOMContentLoaded", function () {
      const page = getPageNumber();

      if (page === 1) {
        const existing = getStoredAnswers();
        if (existing.length > 0) {
          localStorage.removeItem("answers");
        }
      }

      renderQuestions(page);

      document.getElementById("prevBtn").addEventListener("click", function () {
        if (page > 1) {
          window.location.href = `/questions?page=${page - 1}`;
        }
      });

      document.getElementById("nextBtn").addEventListener("click", async function () {
        const ok = saveCurrentPageAnswers(page);
        if (!ok) return;

        if (page < TOTAL_PAGES) {
          window.location.href = `/questions?page=${page + 1}`;
        } else {
          await submitDiagnosis();
        }
      });
    });
  </script>
</body>
</html>

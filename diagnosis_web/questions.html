<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>부모 유형 무료 진단</title>

    body {
      font-family: Arial, sans-serif;
      background-color: #0B132B;
      color: #F8F9FA;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .card {
      background-color: #1C2541;
      border-radius: 16px;
      padding: 24px;
      box-sizing: border-box;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 12px;
      color: #E2B05E;
      font-size: 30px;
    }

    p {
      line-height: 1.7;
      font-size: 16px;
      margin: 10px 0;
    }

    .lead {
      font-size: 20px;
      font-weight: bold;
      color: #F8F9FA;
      margin-top: 8px;
    }

    .sub {
      color: #F8F9FA;
      opacity: 0.95;
    }

    .notice {
      margin-top: 16px;
      font-size: 14px;
      opacity: 0.95;
    }

    .notice.strong {
      background-color: rgba(226, 176, 94, 0.12);
      border: 1px solid rgba(226, 176, 94, 0.25);
      padding: 14px 16px;
      border-radius: 12px;
      color: #F8F9FA;
    }

    .progress-wrap {
      margin-top: 20px;
      margin-bottom: 12px;
    }

    .progress {
      font-size: 14px;
      color: #E2B05E;
      font-weight: bold;
    }

    .mini-copy {
      font-size: 13px;
      opacity: 0.82;
      margin-top: 6px;
    }

    .question {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid rgba(248, 249, 250, 0.15);
    }

    .question-title {
      margin-bottom: 12px;
      font-size: 17px;
      font-weight: bold;
      line-height: 1.6;
    }

    .question-help {
      font-size: 13px;
      opacity: 0.82;
      margin-bottom: 10px;
    }

    .options label {
      display: block;
      margin-bottom: 8px;
      cursor: pointer;
      font-size: 15px;
      line-height: 1.6;
    }

    .text-input,
    .text-area {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid rgba(248, 249, 250, 0.16);
      background-color: #0B132B;
      color: #F8F9FA;
      font-size: 15px;
    }

    .text-area {
      min-height: 120px;
      resize: vertical;
    }

    .button-row {
      margin-top: 28px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .button {
      display: inline-block;
      padding: 14px 20px;
      background-color: #E2B05E;
      color: #0B132B;
      font-weight: bold;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-size: 15px;
    }

    .button.secondary {
      background-color: #3A506B;
      color: #F8F9FA;
    }

    @media (max-width: 640px) {
      .container {
        padding: 20px 14px;
      }

      h1 {
        font-size: 26px;
      }

      .lead {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>부모 유형 무료 진단</h1>

      <p class="lead">
        좋은 부모가 되려는 마음만으로는 반복되는 현실이 바뀌지 않습니다.
      </p>

      <p class="sub">
        부모마다 먼저 무너지는 구조는 다릅니다. 그래서 진단이 필요합니다.
      </p>

      <p class="notice strong">
        이 진단은 부모를 평가하는 도구가 아니라,
        현재 가장 먼저 무너지고 있는 구조를 이해하기 위한 해석입니다.
      </p>

      <p class="notice">
        최근 2주간 반복된 경험에 가깝게 응답해주세요.<br />
        1점 = 전혀 아니다 / 2점 = 거의 아니다 / 3점 = 보통이다 / 4점 = 자주 그렇다 / 5점 = 거의 항상 그렇다
      </p>

      <div class="progress-wrap">
        <div class="progress" id="progressText"></div>
        <div class="mini-copy">지금 어떤 구조가 먼저 흔들리는지 확인하는 과정입니다.</div>
      </div>

      <form id="questionForm">
        <div id="questionsContainer"></div>

        <div class="button-row">
          <button type="button" id="prevBtn" class="button secondary">이전</button>
          <button type="button" id="nextBtn" class="button">다음으로</button>
        </div>
      </form>
    </div>
  </div>

    const TOTAL_QUESTIONS = QUESTIONS.length;
    const QUESTIONS_PER_PAGE = 3;
    const TOTAL_PAGES = Math.ceil(TOTAL_QUESTIONS / QUESTIONS_PER_PAGE);

    function getPageNumber() {
      const params = new URLSearchParams(window.location.search);
      const page = parseInt(params.get("page"), 10) || 1;
      return Math.min(Math.max(page, 1), TOTAL_PAGES);
    }

    function getStoredAnswers() {
      return JSON.parse(localStorage.getItem("answers") || "{}");
    }

    function setStoredAnswers(answers) {
      localStorage.setItem("answers", JSON.stringify(answers));
    }

    function renderLikert(question) {
      return `
        <div class="options">
          <label><input type="radio" name="q${question.no}" value="1"> 1점</label>
          <label><input type="radio" name="q${question.no}" value="2"> 2점</label>
          <label><input type="radio" name="q${question.no}" value="3"> 3점</label>
          <label><input type="radio" name="q${question.no}" value="4"> 4점</label>
          <label><input type="radio" name="q${question.no}" value="5"> 5점</label>
        </div>
      `;
    }

    function renderSingle(question) {
      return `
        <div class="options">
          ${question.options.map((option, index) => `
            <label>
              <input type="radio" name="q${question.no}" value="${index + 1}">
              ${option}
            </label>
          `).join("")}
        </div>
      `;
    }

    function renderText(question) {
      return `
        <textarea
          class="text-area"
          name="q${question.no}"
          placeholder="${question.placeholder || ""}"
        ></textarea>
      `;
    }

    function renderQuestionInput(question) {
      if (question.type === "likert") return renderLikert(question);
      if (question.type === "single") return renderSingle(question);
      if (question.type === "text") return renderText(question);
      return "";
    }

    function renderQuestions(page) {
      const container = document.getElementById("questionsContainer");
      const progressText = document.getElementById("progressText");
      const nextBtn = document.getElementById("nextBtn");
      const prevBtn = document.getElementById("prevBtn");

      const startIndex = (page - 1) * QUESTIONS_PER_PAGE;
      const endIndex = startIndex + QUESTIONS_PER_PAGE;
      const pageQuestions = QUESTIONS.slice(startIndex, endIndex);

      progressText.textContent = `${page} / ${TOTAL_PAGES} 페이지`;

      prevBtn.style.display = page === 1 ? "none" : "inline-block";
      nextBtn.textContent = page === TOTAL_PAGES ? "결과 보기" : "다음으로";

      container.innerHTML = pageQuestions.map((question) => `
        <div class="question">
          <div class="question-title">Q${question.no}. ${question.text}</div>
          ${question.type === "text"
            ? `<div class="question-help">한 문장으로 구체적으로 적어주세요.</div>`
            : ""
          }
          ${renderQuestionInput(question)}
        </div>
      `).join("");

      restoreCurrentPageAnswers(page);
    }

    function restoreCurrentPageAnswers(page) {
      const answers = getStoredAnswers();
      const startIndex = (page - 1) * QUESTIONS_PER_PAGE;
      const endIndex = startIndex + QUESTIONS_PER_PAGE;
      const pageQuestions = QUESTIONS.slice(startIndex, endIndex);

      pageQuestions.forEach((question) => {
        const savedValue = answers[`q${question.no}`];

        if (savedValue === undefined || savedValue === null || savedValue === "") {
          return;
        }

        if (question.type === "likert" || question.type === "single") {
          const radio = document.querySelector(`input[name="q${question.no}"][value="${savedValue}"]`);
          if (radio) radio.checked = true;
        }

        if (question.type === "text") {
          const textarea = document.querySelector(`textarea[name="q${question.no}"]`);
          if (textarea) textarea.value = savedValue;
        }
      });
    }

    function saveCurrentPageAnswers(page) {
      const answers = getStoredAnswers();
      const startIndex = (page - 1) * QUESTIONS_PER_PAGE;
      const endIndex = startIndex + QUESTIONS_PER_PAGE;
      const pageQuestions = QUESTIONS.slice(startIndex, endIndex);

      for (const question of pageQuestions) {
        if (question.type === "likert" || question.type === "single") {
          const checked = document.querySelector(`input[name="q${question.no}"]:checked`);
          if (!checked) {
            alert(`${question.no}번 문항에 응답해주세요.`);
            return false;
          }
          answers[`q${question.no}`] = parseInt(checked.value, 10);
        }

        if (question.type === "text") {
          const textarea = document.querySelector(`textarea[name="q${question.no}"]`);
          const value = textarea ? textarea.value.trim() : "";
          if (!value) {
            alert(`${question.no}번 문항에 응답해주세요.`);
            return false;
          }
          answers[`q${question.no}`] = value;
        }
      }

      setStoredAnswers(answers);
      return true;
    }

    async function submitDiagnosis() {
      const answers = getStoredAnswers();

      if (Object.keys(answers).length !== TOTAL_QUESTIONS) {
        alert("응답 데이터가 완전하지 않습니다.");
        return;
      }

      try {
        const response = await fetch("/api/diagnose", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ answers })
        });

        const data = await response.json();

        if (!data.success) {
          alert("진단 실패: " + data.error);
          return;
        }

        const result = data.result;
        localStorage.setItem("diagnosisResult", JSON.stringify(result));
        window.location.href = "/result";
      } catch (error) {
        alert("서버 오류: " + error.message);
      }
    }

    document.addEventListener("DOMContentLoaded", function () {
      const page = getPageNumber();

      if (page === 1) {
        const existing = getStoredAnswers();
        if (Object.keys(existing).length > 0) {
          localStorage.removeItem("answers");
        }
      }

      renderQuestions(page);

      document.getElementById("prevBtn").addEventListener("click", function () {
        if (page > 1) {
          window.location.href = `/questions?page=${page - 1}`;
        }
      });

      document.getElementById("nextBtn").addEventListener("click", async function () {
        const ok = saveCurrentPageAnswers(page);
        if (!ok) return;

        if (page < TOTAL_PAGES) {
          window.location.href = `/questions?page=${page + 1}`;
        } else {
          await submitDiagnosis();
        }
      });
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>부모 유형 무료 진단</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0B132B;
      color: #F8F9FA;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .card {
      background-color: #1C2541;
      border-radius: 16px;
      padding: 24px;
      box-sizing: border-box;
    }

    h1 {
      margin-top: 0;
      color: #E2B05E;
      font-size: 28px;
    }

    p {
      line-height: 1.7;
      font-size: 16px;
    }

    .highlight {
      color: #E2B05E;
      font-weight: bold;
    }

    .button {
      display: inline-block;
      margin-top: 24px;
      padding: 14px 20px;
      background-color: #E2B05E;
      color: #0B132B;
      text-decoration: none;
      font-weight: bold;
      border-radius: 10px;
    }

    .notice {
      margin-top: 20px;
      font-size: 14px;
      color: #F8F9FA;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>부모 유형 무료 진단</h1>

      <p>
        이 진단은 당신이 좋은 부모인지 판단하지 않습니다.
        지금 <span class="highlight">어떤 구조에서 가장 먼저 무너지고 있는지</span>
        보기 위한 도구입니다.
      </p>

      <p>
        문제는 의지가 아니라 구조일 수 있습니다.
        최근의 반복 패턴에 가깝게 응답해 주세요.
      </p>

      <p>
        진단 결과를 통해 아래 내용을 확인할 수 있습니다.
      </p>

      <p>
        - 지금 가장 먼저 무너지고 있는 축<br />
        - 현재 유형 해석<br />
        - 오늘 바로 할 수 있는 것 1개<br />
        - 추천 매거진 / 가이드 / 다음 단계
      </p>

      <a href="/questions?page=1" class="button">진단 시작하기</a>

      <p class="notice">
        당신의 행복이 행복한 세상의 시작입니다.
      </p>
    </div>
  </div>
</body>
</html>

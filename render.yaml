services:
  - type: web
    name: parent-diagnosis
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_DEBUG
        value: "false"
      - key: APPS_SCRIPT_WEBHOOK_URL
        sync: false
